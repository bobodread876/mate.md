name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Unit + conformance tests (vitest)
        run: npx vitest run

      - name: Validate all fixtures against manifest
        run: npm run validate-all
